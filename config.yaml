# 파일럿 수집 설정 파일
# - 인증키는 여기 적지 말고 .env 파일에 적는다.
# - 시간은 모두 한국 시간(KST) 기준이다.
# - days: weekday = 평일(공휴일 제외), weekend = 토·일·공휴일, all = 매일
# - end는 포함하지 않는다. 예) start "06:00", end "10:00" 이면 06:00~09:59

# ---------------------------------------------------------------
# 1. 수집할 노선
#    route_id를 비워 두면 check_apis.py가 노선번호로 찾아서
#    data/state/resolved_routes.json 에 저장하고, collect.py가 그 값을 쓴다.
# ---------------------------------------------------------------
routes:
  - name: "7770"              # 경기 직행좌석 (수원역-사당역)
    gbis:
      keyword: "7770"
      route_id: ""
    tago:                     # TAGO는 경기 시군만 있음. 앞에서부터 차례로 찾아본다.
      city_codes: [31010]     # 31010 수원시
      route_id: ""
  - name: "M5107"             # 국토부 광역급행 (경희대-서울역)
    gbis:
      keyword: "M5107"
      route_id: ""
    tago:
      city_codes: [31010, 31190]   # 수원시에서 안 나오면 용인시
      route_id: ""
  - name: "M4101"             # 국토부 광역급행 (용인-숭례문) - 2026-11-10 추가
    gbis:
      keyword: "M4101"
      route_id: ""
    tago:
      city_codes: [31190, 31010]   # 용인시에서 안 나오면 수원시
      route_id: ""
  - name: "9401"              # 서울 광역 (분당 구미동-서울역)
    # 2026-11-10 확인: 위치 응답의 congetion(도착 응답의 reride_Num, rerdie_Div=1)이 빈자리 수로 보임
    seoul:
      keyword: "9401"
      route_id: ""
    gbis_backup_check: true   # GBIS에서도 조회되는지 확인만 한다 (서울 노선 백업 후보)
  # 2026-11-12 추가 (노선 후보표 data/ref/route_candidates_scored.csv에서 선정, GBIS만 수집)
  - name: "1000"              # 경기 직행좌석 (고양 대화동-숭례문)
    gbis:
      keyword: "1000"
      route_id: "219000013"   # 같은 번호 노선이 여러 개라 고양시 노선으로 고정
  - name: "5005"              # 경기 직행좌석 (용인 남동차고지-서울역)
    gbis:
      keyword: "5005"
      route_id: "228000175"
  - name: "1500-2"            # 경기 직행좌석 (용인 에버랜드-사당역)
    gbis:
      keyword: "1500-2"
      route_id: "234000313"
  - name: "8002"              # 경기 직행좌석 (남양주 대성리-잠실광역환승센터)
    gbis:
      keyword: "8002"
      route_id: "222000084"

# ---------------------------------------------------------------
# 2. 호출 시간표
#    every_sec: 호출 간격(초). 호출 시각은 시계에 맞춰 정렬된다
#    (예: 120초면 매 짝수 분 00초 근처). 그래서 GBIS와 TAGO를 같은 시각에 비교할 수 있다.
# ---------------------------------------------------------------
schedules:
  # 경기 버스위치 (운영계정 하루 10,000건) - 7개 노선 기준 평일 3,990건, 주말 1,176건 (안전 한도 9,500건 안)
  # 2026-11-12 첨두 간격 2분 -> 1분 (2분일 때 정류장 2칸 이상 건너뜀이 13~30%)
  # 2026-11-13 출근 시작 06:00 -> 05:30 (06시 전에 출발한 운행의 앞 정류장 기록을 남기려고)
  bus_gbis:
    - {days: weekday, start: "05:30", end: "10:00", every_sec: 60}
    - {days: weekday, start: "17:00", end: "22:00", every_sec: 60}
    - {days: weekend, start: "08:00", end: "22:00", every_sec: 300}
  # TAGO 버스위치 (하루 10,000건 한도) - 3개 노선 기준 평일 1,980건, 주말 1,710건
  bus_tago:
    - {days: weekday, start: "06:00", end: "10:00", every_sec: 60}
    - {days: weekday, start: "17:00", end: "22:00", every_sec: 60}
    - {days: weekday, start: "05:00", end: "06:00", every_sec: 300}
    - {days: weekday, start: "10:00", end: "17:00", every_sec: 300}
    - {days: weekday, start: "22:00", end: "24:00", every_sec: 300}
    - {days: weekend, start: "05:00", end: "24:00", every_sec: 120}
  # 서울 버스위치 (운영계정 하루 10,000건) - 1개 노선 기준 평일 570건, 주말 280건
  # 2026-11-13 출근 시작 06:00 -> 05:30
  bus_seoul:
    - {days: weekday, start: "05:30", end: "10:00", every_sec: 60}
    - {days: weekday, start: "17:00", end: "22:00", every_sec: 60}
    - {days: weekend, start: "08:00", end: "22:00", every_sec: 180}
  # 도로공사 실시간 소통(0405) - 하루 288건
  road_ex:
    - {days: all, start: "00:00", end: "24:00", every_sec: 300}
  # 기상청 초단기실황 - 매시 45분에 그 시각 정시 자료를 받는다
  weather:
    - {days: all, start: "00:00", end: "24:00", every_sec: 3600, offset_sec: 2700}
  # 서울 도로 소통 - 링크 1개당 하루 288건
  seoul_link:
    - {days: all, start: "00:00", end: "24:00", every_sec: 300}

# ---------------------------------------------------------------
# 3. 도로공사 실시간 소통 (apiId=0405)
# ---------------------------------------------------------------
road_ex:
  # 0405 페이지의 '요청 URL'을 그대로 붙여 넣는다 (?key= 앞부분까지만).
  # 비워 두면 도로공사 수집은 건너뛴다.
  realtime_url: ""
  extra_params: {}            # 요청 변수가 key, type 말고 더 있으면 여기에 적는다
  full_dump_days: 2           # 처음 며칠은 전국 전체를 그대로 저장 (구조·갱신 주기 파악용)
  # 그 뒤로는 아래 목록에 맞는 콘존만 저장한다. 둘 다 비어 있으면 전체를 계속 저장한다(용량 주의).
  # daily_report.py가 노선번호-노선명 목록을 보여 주니, 그걸 보고 채우면 된다.
  keep_route_nos: []          # 예) ["0010"]  (0010 = 경부선, 응답에서 확인됨)
  keep_conzone_ids: []        # 예) ["0010CZE305"]

# ---------------------------------------------------------------
# 4. 기상청 초단기실황 지점 (위경도 -> 5km 격자로 자동 변환, 같은 격자는 한 번만 호출)
# ---------------------------------------------------------------
weather_points:
  - {name: "수원역", lat: 37.2664, lon: 127.0001}
  - {name: "경희대국제캠퍼스", lat: 37.2397, lon: 127.0833}
  - {name: "분당정자", lat: 37.3670, lon: 127.1086}
  - {name: "양재IC", lat: 37.4705, lon: 127.0383}
  - {name: "사당역", lat: 37.4765, lon: 126.9816}
  - {name: "서울역", lat: 37.5547, lon: 126.9707}
  # 2026-11-12 새 노선 출발 지역 추가
  - {name: "고양대화역", lat: 37.6760, lon: 126.7476}
  - {name: "용인명지대", lat: 37.2223, lon: 127.1872}
  - {name: "용인에버랜드", lat: 37.2939, lon: 127.2026}
  - {name: "남양주마석역", lat: 37.6522, lon: 127.3115}

# ---------------------------------------------------------------
# 5. 서울 도로 소통 (서울 열린데이터광장)
# ---------------------------------------------------------------
seoul_traffic:
  # 데이터셋 페이지(OA-13291) Open API 탭의 샘플 URL에 적힌 서비스명과 같아야 한다.
  service: "TrafficInfo"
  test_link_id: ""            # check_apis.py로 확인할 링크 ID 1개
  link_ids: []                # collect.py가 5분마다 받을 링크 ID 목록 (OA-13309로 찾아서 채우기)

# ---------------------------------------------------------------
# 6. 기타 API
# ---------------------------------------------------------------
seoul_bus_base: "http://ws.bus.go.kr/api/rest"
asos_check_station: 119       # 수원 관측소. ASOS 시간자료 점검에만 쓴다.

# ---------------------------------------------------------------
# 7. 하루 호출 한도 (공공데이터포털 기준. 경기·서울 버스위치는 2026-11-12 운영계정 10,000건).
#    한도가 바뀌면 숫자만 바꾸고 수집기를 다시 켠다. 한도의 safety_ratio까지만 호출한다.
# ---------------------------------------------------------------
quota:
  safety_ratio: 0.95
  limits:
    gbis_busroute: 1000
    gbis_buslocation: 10000
    gbis_arrival: 1000
    gbis_station: 1000
    seoul_busroute: 1000
    seoul_buspos: 10000
    seoul_arrive: 1000
    seoul_station: 1000
    tago_route: 10000
    tago_buslc: 10000
    tago_arvl: 10000
    kma_vilage: 10000
    kasi_spcde: 10000
    kma_asos: 10000
    ex_realtime: 10000        # 도로공사 한도는 포털 마이페이지에서 확인 후 수정
    ex_congest: 10000
    seoul_traffic: 1000       # 서울 열린데이터광장 한도는 확인 후 수정
